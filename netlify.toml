[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # Site env may set NPM_FLAGS=--omit=dev; keep build tools (typescript, etc.)
  NPM_FLAGS = "--include=dev"
  # Ignore leftover local test fixtures if any are scanned
  SECRETS_SCAN_OMIT_PATHS = "test-firebase.js,.env*,*.local"

# Next.js plugin handles all routing automatically
[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "origin-when-cross-origin"
    X-XSS-Protection = "1; mode=block"

[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
